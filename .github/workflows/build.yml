name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up Alire
      uses: alire-project/setup-alire@latest

    - name: Build
      run: |
        alr --force -n update # force to accept curl missing
        alr with --versions
        alr build
